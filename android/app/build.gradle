plugins {
    id "com.android.application"
}

android {
    namespace "com.devayuglass.roadlife"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.devayuglass.roadlife"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.4.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++20"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.31.6"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation files("libs/SDL3-3.4.16.aar")
}
