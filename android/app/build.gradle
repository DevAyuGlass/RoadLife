plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("ROADLIFE_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ROADLIFE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ROADLIFE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ROADLIFE_KEY_PASSWORD")
def releaseSigningReady = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace "com.devayuglass.roadlife"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.devayuglass.roadlife"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.4.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++20"
            }
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.31.6"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation files("libs/SDL3-3.4.16.aar")
}
