name: Android Builds

on:
  push:
    branches: [main]
    paths:
      - 'Engine/**'
      - 'android/**'
      - 'scripts/build-android.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs (all ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Cache Android build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/roadlife-android
            android/app/libs/SDL3-3.4.16.aar
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: roadlife-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'scripts/build-android.sh') }}
          restore-keys: |
            roadlife-android-${{ runner.os }}-

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROADLIFE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            mkdir -p "$RUNNER_TEMP/roadlife-signing"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roadlife-signing/roadlife-release.jks"
            chmod 600 "$RUNNER_TEMP/roadlife-signing/roadlife-release.jks"
            echo "ROADLIFE_KEYSTORE_PATH=$RUNNER_TEMP/roadlife-signing/roadlife-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug and release APKs
        env:
          ROADLIFE_KEYSTORE_PASSWORD: ${{ secrets.ROADLIFE_KEYSTORE_PASSWORD }}
          ROADLIFE_KEY_ALIAS: ${{ secrets.ROADLIFE_KEY_ALIAS }}
          ROADLIFE_KEY_PASSWORD: ${{ secrets.ROADLIFE_KEY_PASSWORD }}
        run: bash scripts/build-android.sh --all

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadLife-Android-debug
          path: build-android/apk/RoadLife-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadLife-Android-release
          path: build-android/apk/RoadLife-release.apk
          if-no-files-found: error
          retention-days: 30
